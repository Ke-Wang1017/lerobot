# @package _global_

# Train with:
#
# python lerobot/scripts/train.py \
#   +dataset=lerobot/pusht_keypoints
#   env=pusht \
#   env.gym.obs_type=environment_state_agent_pos \

seed: 1
dataset_repo_id: KeWangRobotics/piper_push_cube_gamepad_1_cropped_resized

training:
  # Offline training dataloader
  num_workers: 4

  # batch_size: 256
  batch_size: 64
  grad_clip_norm: 10.0
  lr: 3e-4

  storage_device: "cpu"

  eval_freq: 2500
  log_freq: 1
  save_freq: 20000

  online_steps: 1000000
  online_rollout_n_episodes: 10
  online_rollout_batch_size: 10
  online_steps_between_rollouts: 1000
  online_sampling_ratio: 0.5
  online_env_seed: 10000
  online_buffer_capacity: 4096
  offline_buffer_capacity: 4096
  online_buffer_seed_size: 0
  online_step_before_learning: 100 #5000
  do_online_rollout_async: false
  policy_update_freq: 1

  # delta_timestamps:
  #   observation.environment_state: "[i / ${fps} for i in range(${policy.horizon} + 1)]"
  #   observation.state: "[i / ${fps} for i in range(${policy.horizon} + 1)]"
  #   action: "[i / ${fps} for i in range(${policy.horizon})]"
  #   next.reward: "[i / ${fps} for i in range(${policy.horizon})]"

policy:
  name: sac

  pretrained_model_path:

  # Input / output structure.
  n_action_repeats: 1
  horizon: 1
  n_action_steps: 1

  shared_encoder: true
  vision_encoder_name: "helper2424/resnet10"
  freeze_vision_encoder: true
  input_shapes:
    # # TODO(rcadene, alexander-soare): add variables for height and width from the dataset/env?
    observation.state: ["${env.state_dim}"]
    observation.images.wrist: [3, 128, 128]
    observation.images.top: [3, 128, 128]
    # observation.image: [3, 128, 128]
  output_shapes:
    action: ["${env.action_dim}"]

  # Normalization / Unnormalization
  input_normalization_modes:
    observation.images.wrist: mean_std
    observation.images.top: mean_std
    observation.state: min_max
  input_normalization_params:
    observation.images.wrist:
      mean: [0.42934370040893555, 0.43280789256095886, 0.41753706336021423]
      std: [0.16091425716876984, 0.1525210589170456, 0.16938622295856476]
    observation.images.top:
      mean: [0.5897632241249084, 0.5815903544425964, 0.5348829627037048]
      std: [0.15347573161125183, 0.15380138158798218, 0.1543920785188675]
    observation.state:
      min: [-0.0011959957191720605, -0.10435199737548828, -0.009899002499878407, -0.036740005016326904, -0.06554000079631805, -0.01892000436782837] #,  0.]
      max: [0.10031698644161224, 0.09663400053977966, 0.0035039964132010937, 0.04195988178253174, 0.07131993770599365, 0.020489990711212158] #, 0.08]

  output_normalization_modes:
    action: min_max
  output_normalization_params:
    action:
      max: [0.005,
            0.01,
            0.002] #, 0.08]
      min: [-0.005,
            -0.01,
            -0.002] #,  0.]

  # Architecture / modeling.
  # Neural networks.
  image_encoder_hidden_dim: 32
  # discount: 0.99
  discount: 0.97
  temperature_init: 1e-2
  num_critics: 2 #10
  camera_number: 2
  num_subsample_critics: null
  critic_lr: 3e-4
  actor_lr: 3e-4
  temperature_lr: 3e-4
  # critic_target_update_weight: 0.005
  critic_target_update_weight: 0.01
  utd_ratio: 2 # 10

actor_learner_config:
  learner_host: "127.0.0.1"
  learner_port: 50051
  policy_parameters_push_frequency: 15
  concurrency:
    actor: "threads"
    learner: "threads"

wandb:
  enable: true
  # Set to true to disable saving an artifact despite save_checkpoint == True
  disable_artifact: true
  project: lerobot
  notes: "HIL-SERL Piper"
  # # Loss coefficients.
  # reward_coeff: 0.5
  # expectile_weight: 0.9
  # value_coeff: 0.1
  # consistency_coeff: 20.0
  # advantage_scaling: 3.0
  # pi_coeff: 0.5
  # temporal_decay_coeff: 0.5
  # # Target model.
  # target_model_momentum: 0.995